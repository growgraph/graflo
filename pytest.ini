[pytest]
log_cli = True
# log_cli_level = DEBUG
log_cli_level = WARNING
# log_cli_level = ERROR

# A hung test used to present as an indefinite silent stall -- run-tests.sh
# redirects every job's output to a log file and reaps with a bare `wait`, so
# there was nothing to look at. These two turn a hang into evidence:
#   faulthandler_timeout dumps every thread's stack (stdlib, works even when the
#   process is wedged on a lock that ignores signals), then the pytest-timeout
#   entry below fails the test rather than killing the run.
# timeout_method must stay `thread`: a deadlocked C-level lock ignores SIGALRM.
faulthandler_timeout = 300
timeout = 300
timeout_method = thread

# Slow tests are gated by marker, but only once someone can see which they are.
addopts = --durations=25

markers =
    kafka: marks Kafka integration tests (skipped unless --run-kafka is passed)
    tigergraph: marks live TigerGraph tests (skipped unless --run-tigergraph is passed)
    bulk_e2e: marks TigerGraph native bulk end-to-end tests (skipped unless --run-bulk-e2e is passed)
    nebula: marks NebulaGraph integration tests (skipped unless --run-nebula is passed)
    performance: marks performance / stress tests (skipped unless --run-performance is passed)
