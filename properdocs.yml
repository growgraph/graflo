site_name: GraFlo
site_url: https://growgraph.github.io/graflo
repo_url: https://github.com/growgraph/graflo
repo_name: growgraph/graflo
copyright: Copyright &copy; 2021-2026 GrowGraph
edit_uri: edit/main/docs/
theme:
    name: material
    user_color_mode_toggle: true
    # Colours are set in docs/stylesheets/extra.css.
    palette:
    -   scheme: default
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch-off-outline
            name: Switch to dark mode
    -   scheme: slate
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch
            name: Switch to light mode
    font:
        text: Source Sans 3
        code: JetBrains Mono
    # The mark on its white disc: bare orange on the ink header is too faint.
    logo: assets/logo.svg
    icon:
        repo: fontawesome/brands/github
    favicon: assets/favicon.svg
    features:
    -   navigation.tabs
    -   navigation.tabs.sticky
    # Not `navigation.indexes`: every example page is `<slug>/index.md`, so the
    # first example of each group would become that group's index and drop
    # out of the sidebar.
    -   navigation.top
    -   navigation.footer
    -   toc.follow
    -   content.code.copy
    -   content.action.edit
    -   search.highlight
    -   search.suggest
extra_css:
-   https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap
-   stylesheets/extra.css
plugins:
# Underscores are separators, so `vertex_router` is indexed as its words as
# well as whole; without this an identifier is one opaque token.
-   search:
        separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|_'
-   glightbox
-   gen-files:
        scripts:
        -   docs/_build/gen_pages.py
        -   docs/_build/gen_examples.py
-   literate-nav
-   table-reader: []
-   mkdocstrings:
        default_handler: python
        handlers:
            python:
                options:
                    show_root_full_path: true
                    show_source: true
                    show_root_toc_entry: false
                    docstring_style: google
                    show_category_heading: true
                    show_if_no_docstring: true
validation:
    omitted_files: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn
nav:
-   Home: index.md
-   Getting started:
    -   Installation: getting_started/installation.md
    -   Quick start: getting_started/quickstart.md
    -   Creating a manifest: getting_started/creating_manifest.md
-   Concepts:
    -   Overview: concepts/index.md
    -   Glossary: concepts/glossary.md
    -   Architecture:
        -   Diagrams: concepts/architecture/diagrams.md
        -   Core components: concepts/architecture/core_components.md
    -   Schema and manifest:
        -   Sampling and profiling: concepts/schema/sampling_and_profiling.md
        -   Vertex identity: concepts/schema/vertex_identity.md
        -   Cross-resource identity discovery: concepts/schema/cross_resource_identity.md
        -   Cards: concepts/schema/cards.md
        -   Backend indexes: concepts/schema/backend_indexes.md
        -   Manifest evolution: concepts/schema/manifest_evolution.md
        -   Merging manifests: concepts/schema/merging_manifests.md
        -   Version control: concepts/schema/versioning.md
        -   Live schema drift: concepts/schema/live_drift.md
        -   Conformance profiles: concepts/schema/world_model_profile.md
        -   GraFlo ontology: concepts/schema/ontology.md
    -   Ingestion:
        -   Transforms: concepts/ingestion/transforms.md
        -   Parallelism: concepts/ingestion/parallelism.md
        -   Document cast errors: concepts/ingestion/doc_errors.md
    -   Connectors:
        -   Table filters and views: concepts/connectors/table_views.md
        -   API connector: concepts/connectors/api_connector.md
        -   Kafka connector: concepts/connectors/kafka_connector.md
        -   Runtime connector updates: concepts/connectors/runtime_updates.md
    -   Operations:
        -   Graph export and migration: concepts/operations/graph_export_migration.md
        -   Removing vertices and edges: concepts/operations/deleting_instances.md
        -   Object storage: concepts/operations/object_storage.md
        -   Schema migration: concepts/operations/migration_and_practices.md
-   Guides:
    -   Guides index: guides/index.md
    -   Database connections: guides/database_connections.md
    -   Importing and layering: guides/importing.md
    -   Graph DB migration: guides/graph_db_migration.md
    -   Graph namespace and schema: guides/graph_namespace_and_schema.md
    -   Graph export and replay: guides/graph_export_and_replay.md
    -   API env wiring: guides/api_env_wiring.md
    -   Finding a key for your data: guides/identity_inference.md
    -   Evolving a manifest: guides/evolving_a_manifest.md
    -   TigerGraph bulk load: guides/tigergraph_bulk_load.md
    -   Inferring a graph from SQL: guides/sql_schema_inference.md
    -   Adding a database backend: guides/adding_a_backend.md
-   Examples:
    -   Examples index: examples/index.md
    -   Basic ingestion:
        -   01 - CSV files into a graph: examples/csv-two-resources/index.md
        -   02 - Records that refer to their own kind: examples/json-self-edges/index.md
        -   03 - Several relations between the same two things: examples/csv-relation-field/index.md
        -   04 - Nested JSON with relations in the keys: examples/json-relation-from-key/index.md
    -   Pipeline features:
        -   05 - Price columns as measurements: examples/vertex-filters-and-weights/index.md
        -   06 - One kind of thing in several roles: examples/vertex-roles-edge-links/index.md
        -   07 - One table that holds many kinds of things: examples/vertex-router-type-map/index.md
        -   08 - Rows that name their own types: examples/vertex-router-flat-rows/index.md
    -   Schema inference:
        -   09 - A graph from a PostgreSQL database: examples/infer-from-postgres/index.md
        -   10 - A graph from an ontology and RDF data: examples/infer-from-rdf/index.md
    -   Connections:
        -   11 - Credentials outside the manifest: examples/connection-proxy/index.md
        -   12 - API sources from environment variables: examples/api-env-config/index.md
        -   13 - Bulk load into TigerGraph: examples/tigergraph-bulk-s3/index.md
    -   File backend:
        -   14 - A graph on disk, without a database: examples/file-backend-export/index.md
    -   Identity:
        -   15 - Find what identifies a record: examples/identity-inference/index.md
        -   16 - Link by an alternative identifier: examples/secondary-identities/index.md
        -   17 - One vertex per thing across sources: examples/identity-funnel/index.md
        -   18 - Find matching columns across systems: examples/cross-resource-identity/index.md
    -   Evolution:
        -   19 - Both directions of a relation: examples/edge-inverses/index.md
        -   20 - Combine two manifests: examples/manifest-union/index.md
        -   21 - Combine manifests with a routed source: examples/router-union-alignment/index.md
        -   22 - Version control for a manifest: examples/version-control/index.md
    -   Profiles:
        -   23 - Track state and measurements: examples/state-core-lift/index.md
-   API Reference: reference/
-   Internals:
    -   Merge internals: internals/merge_internals.md
-   Contributing: contributing.md
markdown_extensions:
-   pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
-   pymdownx.inlinehilite
-   pymdownx.snippets
-   pymdownx.superfences:
        custom_fences:
        -   name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
-   attr_list
-   md_in_html
-   admonition
-   codehilite
-   footnotes
-   meta
-   pymdownx.blocks.caption
-   pymdownx.details
-   pymdownx.tabbed
-   pymdownx.emoji
-   pymdownx.tasklist
-   pymdownx.keys
-   pymdownx.magiclink
-   pymdownx.betterem
-   pymdownx.caret
-   pymdownx.tilde
-   pymdownx.mark
-   pymdownx.smartsymbols
-   pymdownx.arithmatex
-   pymdownx.progressbar
-   pymdownx.escapeall
-   toc:
        permalink: true
