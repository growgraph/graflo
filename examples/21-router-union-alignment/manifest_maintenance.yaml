schema:
    metadata:
        name: maintenance
        version: 1.0.0
    graph:
        vertex_config:
            vertices:
            -   name: Machine
                properties:
                -   asset_id
                -   serial_number
                -   name
                identity:
                -   asset_id
            -   name: ProductionLine
                properties:
                -   asset_id
                -   name
                identity:
                -   asset_id
        edge_config:
            edges: []
ingestion_model:
    resources:
    # One register holds machines and production lines; its `type` column says
    # which type each row becomes.
    -   name: register
        pipeline:
        -   vertex_router:
                type_field: type
                type_map:
                    machine: Machine
                    line: ProductionLine
    transforms: []
