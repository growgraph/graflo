schema:
    metadata:
        name: source-a-view+source-b
        version: 1.1.0
    core_schema:
        vertex_config:
            vertices:
            -   name: Company
                properties:
                -   name: company_id
                -   name: secondary_key
                -   name: shop_id
                -   name: branch_id
                -   name: shared_raw
                -   name: org_id
                -   name: match_key
                -   name: local_key
                -   name: id
                identity:
                -   id
                filters: []
                blank: false
                assigned: false
                hash_identity_properties: []
                identity_funnel:
                    digest: sha256
                    include_branch_id: true
                    branches:
                    -   id: match_key
                        fields:
                        -   match_key
                    -   id: local_key
                        fields:
                        -   local_key
                secondary_identities:
                -   name: by_branch_id
                    fields:
                    -   branch_id
                -   name: by_company_id
                    fields:
                    -   company_id
                -   name: by_org_id
                    fields:
                    -   org_id
                -   name: by_shop_id
                    fields:
                    -   shop_id
            -   name: Person
                properties:
                -   name: person_id
                -   name: secondary_key
                identity:
                -   person_id
                filters: []
                blank: false
                assigned: false
                hash_identity_properties: []
                secondary_identities: []
            force_types: {}
            identity_from_all_properties: true
        edge_config:
            edges: []
            inverses: []
            symmetric: []
    db_profile:
        db_flavor: arango
        vertex_storage_names: {}
        vertex_property_names: {}
        vertex_indexes:
            Company:
            -   fields:
                -   branch_id
                unique: false
                type: persistent
                deduplicate: true
                sparse: false
                exclude_edge_endpoints: false
            -   fields:
                -   company_id
                unique: false
                type: persistent
                deduplicate: true
                sparse: false
                exclude_edge_endpoints: false
            -   fields:
                -   org_id
                unique: false
                type: persistent
                deduplicate: true
                sparse: false
                exclude_edge_endpoints: false
            -   fields:
                -   shop_id
                unique: false
                type: persistent
                deduplicate: true
                sparse: false
                exclude_edge_endpoints: false
        edge_specs: []
        native_inverses: []
ingestion_model:
    edges_on_duplicate: ignore
    endpoints_on_ambiguous: all
    resources:
    -   name: r_view
        pipeline:
        -   key: records
            pipeline:
            -   type_field: kind
                keep_fields:
                -   firm_id
                -   shop_id
                -   person_id
                -   secondary_key
                -   match_key
                -   local_key
                type_map:
                    firm: Company
                    shop: Company
                    person: Person
                    Firm: Company
                    Shop: Company
                    Person: Person
                type: vertex_router
                type_map_only: true
            -   call:
                    module: graflo.util.transform
                    foo: affix_gated_key
                    params:
                        prefix: abc_
                    output:
                    -   match_key
                    input:
                    -   secondary_key
                when:
                    field: kind
                    in:
                    -   firm
                type: transform
            -   call:
                    module: graflo.util.transform
                    foo: affix_gated_key
                    params:
                        prefix: def_
                    output:
                    -   match_key
                    input:
                    -   secondary_key
                when:
                    field: kind
                    in:
                    -   shop
                type: transform
            -   call:
                    module: graflo.util.transform
                    foo: tagged_key
                    params:
                        tag: firm
                        sep: ':'
                    output:
                    -   local_key
                    input:
                    -   firm_id
                when:
                    field: kind
                    in:
                    -   firm
                type: transform
            -   call:
                    module: graflo.util.transform
                    foo: tagged_key
                    params:
                        tag: shop
                        sep: ':'
                    output:
                    -   local_key
                    input:
                    -   shop_id
                when:
                    field: kind
                    in:
                    -   shop
                type: transform
            type: descend
        encoding: utf-8
        merge_collections: []
        extra_weights: []
        types: {}
        infer_edges: true
        infer_edge_only: []
        infer_edge_except: []
        drop_trivial_input_fields: false
        fail_fast: false
        tolerate_transform_errors: true
    -   name: r_b
        pipeline:
        -   vertex: Company
            type: vertex
        -   transform:
                call:
                    module: graflo.util.transform
                    foo: affix_gated_key
                    params:
                        prefix: abc_
                    output:
                    -   match_key
                    input:
                    -   shared_raw
        -   transform:
                call:
                    module: graflo.util.transform
                    foo: tagged_key
                    params:
                        tag: b
                        sep: ':'
                    output:
                    -   local_key
                    input:
                    -   org_id
        encoding: utf-8
        merge_collections: []
        extra_weights: []
        types: {}
        infer_edges: true
        infer_edge_only: []
        infer_edge_except: []
        drop_trivial_input_fields: false
        fail_fast: false
        tolerate_transform_errors: true
    -   name: r_branch
        pipeline:
        -   vertex: Company
            type: vertex
        -   transform:
                call:
                    module: graflo.util.transform
                    foo: affix_gated_key
                    params:
                        prefix: def_
                    output:
                    -   match_key
                    input:
                    -   shared_raw
        -   transform:
                call:
                    module: graflo.util.transform
                    foo: tagged_key
                    params:
                        tag: br
                        sep: ':'
                    output:
                    -   local_key
                    input:
                    -   branch_id
        encoding: utf-8
        merge_collections: []
        extra_weights: []
        types: {}
        infer_edges: true
        infer_edge_only: []
        infer_edge_except: []
        drop_trivial_input_fields: false
        fail_fast: false
        tolerate_transform_errors: true
    transforms: []
