schema:
    metadata:
        name: catalog
    core_schema:
        vertex_config:
            vertices:
            -   name: product
                properties:
                -   name: org
                -   name: product_code
                -   name: name
                -   name: category
                -   name: updated_at
                identity:
                -   product_code
                -   org
            -   name: supplier
                properties:
                -   name: supplier_code
                -   name: name
                -   name: country
                identity:
                -   supplier_code
            identity_from_all_properties: false
        edge_config: {}
ingestion_model:
    resources:
    -   name: products
        pipeline:
        -   vertex: product
    -   name: suppliers
        pipeline:
        -   vertex: supplier
bindings:
    connectors:
    -   resource_name: products
        regex: ^products\.csv$
        sub_path: data
    -   resource_name: suppliers
        regex: ^suppliers\.csv$
        sub_path: data
