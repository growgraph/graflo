# How to combine manifest_maintenance.yaml (left) and manifest_sensors.yaml (right).
op: merge_manifests

# 1. The map of names: what each side's words become in the combined manifest.
canonical_maps:
    left: {vertices: {Asset: Machine}}
    right: {properties: {Device: {serial: serial_number}}}

# 2. These two types are one.
vertex_equivalences:
-   left: Asset
    right: Device

# 3. How records from both sides find each other.
identity_alignments:
-   vertex: Machine
    attributes:
    -   name: match_key
        sources:
            assets: {foo: normalized_key, input: [serial_number]}
            devices: {foo: normalized_key, input: [serial]}
    local_key:
        sources:
            assets: {field: asset_id, tag: maintenance}
            devices: {field: device_id, tag: sensors}
