schema:
    metadata:
        name: maintenance+sensors
        version: 1.1.0
    core_schema:
        vertex_config:
            vertices:
            -   name: Machine
                properties:
                -   name: maintenance__asset_id
                -   name: serial_number
                -   name: name
                -   name: sensors__device_id
                -   name: model
                -   name: match_key
                -   name: id
                identity:
                -   id
                identity_funnel:
                    branches:
                    -   id: match_key
                        fields:
                        -   match_key
                    -   id: maintenance__asset_id
                        fields:
                        -   maintenance__asset_id
                    -   id: sensors__device_id
                        fields:
                        -   sensors__device_id
                secondary_identities:
                -   name: maintenance
                    fields:
                    -   maintenance__asset_id
                -   name: sensors
                    fields:
                    -   sensors__device_id
            -   name: WorkOrder
                properties:
                -   name: work_order_id
                identity:
                -   work_order_id
        edge_config:
            edges:
            -   source: WorkOrder
                target: Machine
                relation: targets
    db_profile:
        vertex_indexes:
            Machine:
            -   fields:
                -   maintenance__asset_id
            -   fields:
                -   sensors__device_id
ingestion_model:
    resources:
    -   name: assets
        pipeline:
        -   vertex: Machine
            from:
                maintenance__asset_id: asset_id
        -   transform:
                call:
                    module: graflo.util.transform
                    foo: normalized_key
                    input:
                    -   serial_number
                    output:
                    -   match_key
    -   name: devices
        pipeline:
        -   vertex: Machine
            from:
                serial_number: serial
                sensors__device_id: device_id
        -   transform:
                call:
                    module: graflo.util.transform
                    foo: normalized_key
                    input:
                    -   serial
                    output:
                    -   match_key
    -   name: work_orders
        pipeline:
        -   vertex: WorkOrder
        -   vertex: Machine
            from:
                maintenance__asset_id: asset_id
            lookup_only: true
        -   edge:
                target_match: maintenance
                from: WorkOrder
                to: Machine
                relation: targets
metadata:
    gstl: '1.0'
