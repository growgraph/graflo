schema:
    metadata:
        name: identity-funnel-demo
        version: "1.0.0"
    graph:
        vertex_config:
            vertices:
            -   name: party
                properties:
                -   {name: id, type: STRING}
                -   {name: email, type: STRING}
                -   {name: phone, type: STRING}
                -   {name: country, type: STRING}
                -   {name: name, type: STRING}
                -   {name: dob, type: STRING}
                identity: [id]
                # Branches are tried in order. The first one whose fields are
                # all filled in is hashed into id; name and date of birth are
                # the weakest evidence, so they come last.
                identity_funnel:
                    branches:
                    -   id: email
                        fields: [email]
                    -   id: phone
                        fields: [phone, country]
                    -   id: weak
                        fields: [name, dob]
        edge_config:
            edges: []
    db_profile: {}
ingestion_model:
    resources:
    -   name: crm
        pipeline:
        -   vertex: party
    -   name: billing
        pipeline:
        -   vertex: party
bindings:
    connectors:
    -   regex: "^crm\\.csv$"
        sub_path: data
        resource_name: crm
    -   regex: "^billing\\.csv$"
        sub_path: data
        resource_name: billing
