schema:
    metadata:
        name: source-a
        version: 1.0.0
    graph:
        vertex_config:
            vertices:
            -   name: Firm
                properties:
                -   firm_id
                -   secondary_key
                -   shared_raw
                identity:
                -   firm_id
            -   name: Shop
                properties:
                -   shop_id
                -   secondary_key
                -   shared_raw
                identity:
                -   shop_id
            -   name: Agreement
                properties:
                -   agreement_id
                identity:
                -   agreement_id
        edge_config:
            edges:
            -   source: Agreement
                target: Firm
                relation: signedBy
ingestion_model:
    resources:
    -   name: r_a
        pipeline:
        -   vertex: Firm
    -   name: r_shop
        pipeline:
        -   vertex: Shop
    # References Firm by firm_id and never upserts it: an edge-only source.
    -   name: r_agreements
        pipeline:
        -   vertex: Agreement
        -   vertex: Firm
            lookup_only: true
        -   source: Agreement
            target: Firm
            relation: signedBy
    transforms: []
