[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{ email = "alexander@growgraph.dev", name = "Alexander Belikov" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython"
]
dependencies = [
  "click>=8.2.0,<9",
  "ijson>=3.2.3,<4",
  "networkx~=3.3",
  "pandas-stubs==2.3.0.250703",
  "pandas>=2.0.3,<4",
  "pydantic-settings>=2.12.0",
  "pydantic>=2.12.5",
  "rdflib>=7.0.0",
  "requests>=2.31.0",
  "strenum>=0.4.15",
  "suthing>=0.6.1,<0.7",
  "urllib3>=2.0.0",
  "xmltodict>=0.14.2,<0.15"
]
description = "Manifest-driven Graph Schema & Transformation Language (GSTL): declare a labeled property graph with explicit identities, typed properties and semantic grounding; evolve it with an invertible op algebra, content-addressed commits and three-way merge; ingest from CSV/JSON/Parquet/SQL/RDF/SPARQL/API/Kafka; and project to ArangoDB, Neo4j, TigerGraph, FalkorDB, Memgraph, NebulaGraph, Grafeo, PostgreSQL or a chunked file backend."
# PEP 639 SPDX expression; no `License ::` classifier (the two must not disagree).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
name = "graflo"
readme = "README.md"
requires-python = ">=3.12"
version = "1.28.0"

[project.optional-dependencies]
all = [
  "graflo[arango,falkordb,grafeo,kafka,memgraph,nebula,neo4j,postgres,s3,sparql,sql]"
]
arango = [
  "python-arango>=8.1.2,<9"
]
bulk = [
  "duckdb>=1.1",
  "zstandard>=0.23"
]
dev = [
  "graflo[all,bulk]",
  "hypothesis>=6.140.0",
  "jsonschema>=4.23.0",
  "pre-commit>=4.2.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "pytest>=9.0.2",
  "ty>=0.0.1a24"
]
docs = [
  "mkdocs-gen-files>=0.5.0",
  "mkdocs-glightbox>=0.4.0",
  "mkdocs-literate-nav>=0.6.2",
  "mkdocs-material>=9.6.12",
  "mkdocs-table-reader-plugin>=3.1.0",
  "mkdocstrings[python]>=0.29.1",
  "properdocs>=1.6.7"
]
falkordb = [
  "falkordb>=1.0.9",
  "redis>=5.0.0"
]
grafeo = [
  "grafeo>=0.6.3,<0.7"
]
kafka = [
  "confluent-kafka>=2.6.0"
]
memgraph = [
  "pymgclient>=1.3.1"
]
nebula = [
  "nebula3-python>=3.8.3",
  "nebula5-python>=5.2.1"
]
neo4j = [
  "neo4j>=5.22.0,<6"
]
plot = [
  "pypdfium2>=5,<6",
  "svglib>=2.2,<3",
  "wasi-graphviz[wasmtime]>=0.1.4,<0.2"
]
postgres = [
  "psycopg2-binary>=2.9.11",
  "sqlalchemy>=2.0.0"
]
s3 = [
  "boto3>=1.35.0,<2"
]
sparql = [
  "SPARQLWrapper>=2.0.0"
]
sql = [
  "psycopg2-binary>=2.9.11",
  "sqlalchemy>=2.0.0"
]

[project.scripts]
graflo = "graflo.cli.main:graflo"
ingest = "graflo.cli.ingest:ingest"
install_tigergraph_queries = "graflo.cli.install_tigergraph_queries:install_tigergraph_queries"
manage_dbs = "graflo.cli.manage_dbs:manage_dbs"
manifest_to_rdf = "graflo.rdf.cli:manifest_to_rdf"
migrate_schema = "graflo.cli.migrate_schema:migrate_schema"
plot_manifest = "graflo.cli.plot_manifest:plot_manifest"
rdf_to_manifest = "graflo.rdf.cli:rdf_to_manifest"
run_tigergraph_queries = "graflo.cli.run_tigergraph_queries:run_tigergraph_queries"
xml2json = "graflo.cli.xml2json:xml2json"

[project.urls]
Changelog = "https://github.com/growgraph/graflo/blob/main/CHANGELOG.md"
Documentation = "https://growgraph.github.io/graflo"
Homepage = "https://growgraph.dev/open-source/graflo"
Repository = "https://github.com/growgraph/graflo"

[tool.hatch.build.targets.sdist]
include = ["graflo"]

[tool.hatch.build.targets.wheel]
include = ["graflo"]

[tool.ruff.lint]
# Ruff 0.16 expanded defaults (~413 rules). Keep the new set, but silence
# categories that conflict with intentional patterns in this codebase:
# B017 pytest.raises(Exception); BLE001/S110/S112 broad except cleanup;
# DTZ* naive graph datetimes; E722 bare except; G201 logger.error+exc_info;
# LOG015 CLI root logger; RUF012 class mutable defaults; TRY004 ValueError
# validation API; TRY203 mixin re-raise wrappers; UP040/UP046/UP047 PEP 695
# syntax, whose aliases are TypeAliasType at runtime (isinstance, get_args).
ignore = [
  "B017",
  "BLE001",
  "DTZ001",
  "DTZ007",
  "DTZ011",
  "E722",
  "G201",
  "LOG015",
  "RUF012",
  "S110",
  "S112",
  "TRY004",
  "TRY203",
  "UP040",
  "UP046",
  "UP047"
]

[tool.uv]
# One uv line for every contributor and for CI: a different minor rewrites uv.lock
# wholesale with identical content. Bump this together with the workflow pins.
required-version = ">=0.12.21,<0.14"
