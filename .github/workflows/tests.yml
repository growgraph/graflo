name: tests

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    offline:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7

        -   name: Install uv
            uses: astral-sh/setup-uv@v10.3.0
            with:
                version: "0.12.21"
                python-version: "3.11"
                enable-cache: true

        -   name: Install dependencies (dev and plot)
            run: uv sync --locked --extra dev --extra plot

        # test/db needs database containers. The live parts of test/data_source
        # and test/object_storage skip when their service is unreachable.
        -   name: Run the container-free suites
            run: uv run pytest test --ignore=test/db -n auto --dist loadfile

