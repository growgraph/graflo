name: tests

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: tests-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    offline:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7

        -   name: Install uv
            uses: astral-sh/setup-uv@v10.3.0
            with:
                version: "0.12.21"
                python-version: "3.12"
                enable-cache: true

        -   name: Install dependencies (dev and plot)
            run: uv sync --locked --extra dev --extra plot

        # test/db needs database containers. The live parts of test/data_source
        # and test/object_storage skip when their service is unreachable.
        -   name: Run the container-free suites
            run: uv run pytest test --ignore=test/db -n auto --dist loadgroup

        # Grafeo is embedded: its live suite needs no container.
        -   name: Run the Grafeo suite
            run: uv run pytest test/db/grafeos

    # Drivers are optional extras: a bare install imports and lists its backends.
    no-extras:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7

        -   name: Install uv
            uses: astral-sh/setup-uv@v10.3.0
            with:
                version: "0.12.21"
                python-version: "3.12"
                enable-cache: true

        -   name: Install graflo without extras
            run: uv sync --locked --no-dev

        -   name: Import every module and read the capability tables
            run: >-
                uv run --no-sync python -c "import importlib, pkgutil, graflo, graflo.db,
                graflo.data_source, graflo.hq, graflo.cli.main;
                [importlib.import_module(m.name) for p in (graflo.db, graflo.data_source)
                for m in pkgutil.walk_packages(p.__path__, p.__name__ + '.')];
                from graflo.db.conn import ConnectionCapability;
                from graflo.db.manager import ConnectionManager;
                [ConnectionManager.flavors_supporting(c) for c in ConnectionCapability]"

        -   name: Run the CLI
            run: uv run --no-sync graflo --help

    # Disabled for now: the public API is changing freely before a stable release.
