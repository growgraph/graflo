services:
    neo4j:
        image: ${IMAGE_VERSION}
        restart: "no"
        profiles: ["${SPEC}.neo4j"]
        ports:
        -   "${NEO4J_PORT}:7474"
        -   "${NEO4J_BOLT_PORT}:7687"
        container_name: ${CONTAINER_NAME}
        volumes:
        -   neo4j_data:/data
        -   neo4j_logs:/logs
        environment:
        -   NEO4J_AUTH=${NEO4J_AUTH}
        -   NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_SIZE}
        -   NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_SIZE}
        -   NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE_SIZE}
        # HTTP comes up right after Bolt.
        healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || curl -fs -o /dev/null http://localhost:7474 || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s

volumes:
    neo4j_data:
        driver: local
    neo4j_logs:
        driver: local
